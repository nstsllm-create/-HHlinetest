<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>His and Hairs Booking</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      color: #222;
    }
    main {
      max-width: 520px;
      margin: 24px auto;
      padding: 28px;
      background: white;
      border-radius: 20px;
    }
    h1 { font-size: 26px; margin-top: 0; }
    h2 { font-size: 20px; margin-top: 28px; }
    p { line-height: 1.7; }
    label { display: block; margin: 16px 0 10px; }
    select, button {
      width: 100%;
      padding: 14px;
      font: inherit;
      border-radius: 10px;
    }
    select { border: 1px solid #ccc; background: white; }
    button {
      margin-top: 16px;
      border: 0;
      background: #06c755;
      color: white;
      cursor: pointer;
    }
    .note { color: #666; font-size: 14px; }
    #summary {
      margin-top: 24px;
      padding: 18px;
      background: #f0fdf4;
      border-radius: 12px;
    }
    #summary p { margin: 8px 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>His and Hairs Booking</h1>
    <p id="status" role="status">กำลังเชื่อมต่อ LINE…</p>
    <button id="login" hidden>เข้าสู่ระบบ LINE</button>

    <section id="booking" hidden>
      <h2>1. เลือกสาขา</h2>
      <label for="branch">สาขาที่ต้องการใช้บริการ</label>
      <select id="branch">
        <option value="">กรุณาเลือกสาขา</option>
        <optgroup label="His and Hairs">
          <option value="hh-square">His and Hairs — ศิรินครสแควร์</option>
          <option value="hh-camp">His and Hairs — หน้าค่ายวชิราวุธ</option>
          <option value="hh-walailak">His and Hairs — วลัยลักษณ์</option>
        </optgroup>
        <optgroup label="BarberBoss">
          <option value="bb-muangthong">BarberBoss — หมู่บ้านเมืองทอง</option>
          <option value="bb-walailak">BarberBoss — วลัยลักษณ์</option>
          <option value="bb-thaphae">BarberBoss — 7-Eleven ท่าแพ</option>
        </optgroup>
      </select>

      <section id="serviceSection" hidden>
        <h2>2. เลือกบริการ</h2>
        <label for="service">บริการและราคา</label>
        <select id="service"></select>
        <p class="note">ราคาปกติสำหรับทดสอบ ยังไม่รวมโปรโมชั่น</p>
      </section>

      <section id="summary" aria-live="polite" hidden>
        <strong>รายการที่เลือก</strong>
        <p id="summaryBranch"></p>
        <p id="summaryService"></p>
        <p id="summaryPrice"></p>
        <p id="summaryDuration"></p>
        <p class="note">ยังไม่ได้จองคิว ขั้นตอนเลือกช่างและวันเวลาจะเพิ่มต่อไป</p>
      </section>
    </section>

    <p class="note">หน้าทดสอบ ยังไม่เปิดรับจองหรือรับชำระเงิน</p>
  </main>

  <script>
    const LIFF_ID = "2007513533-R2eJcQzQ";
    const statusBox = document.getElementById("status");
    const loginButton = document.getElementById("login");
    const branchSelect = document.getElementById("branch");
    const serviceSelect = document.getElementById("service");
    const serviceSection = document.getElementById("serviceSection");
    const summary = document.getElementById("summary");

    function haircut(price) {
      return {
        id: "cut-" + price,
        name: "ตัดผม " + price + " บาท",
        price: price,
        minutes: 45
      };
    }

    const chemicalServices = [
      { id: "volume-straight", name: "ยืดวอลลุ่ม", price: 1500, minutes: 180 },
      { id: "keratin", name: "เคราติน", price: 1800, minutes: 180 },
      { id: "premium-straight", name: "ยืดพรีเมียม", price: 2000, minutes: 180 },
      { id: "volume-perm", name: "ดัดวอลลุ่ม", price: 1500, minutes: 180 },
      { id: "curly", name: "ดัดเคอร์ลี่", price: 1800, minutes: 180 },
      { id: "foil", name: "ดัดฟอยล์", price: 1800, minutes: 180 },
      { id: "rod-spiral", name: "ดัดแกน / สไปรัล", price: 1800, minutes: 180 },
      { id: "grey-cover", name: "ปิดผมขาว", price: 600, minutes: 180 },
      { id: "fashion-color", name: "ทำสีแฟชั่น", price: 2500, minutes: 180 }
    ];

    const servicesByBranch = {
      "hh-square": [
        haircut(300),
        haircut(400),
        haircut(500),
        ...chemicalServices
      ],
      "hh-camp": [haircut(150), haircut(200)],
      "hh-walailak": [haircut(150), haircut(200)],
      "bb-muangthong": [haircut(100)],
      "bb-walailak": [haircut(100)],
      "bb-thaphae": [haircut(100)]
    };

    branchSelect.addEventListener("change", () => {
      summary.hidden = true;
      serviceSelect.replaceChildren(
        new Option("กรุณาเลือกบริการ", "")
      );

      const services = servicesByBranch[branchSelect.value] || [];
      serviceSection.hidden = services.length === 0;

      services.forEach(service => {
        const label = service.name +
          " — " + service.price.toLocaleString("th-TH") + " บาท";
        serviceSelect.add(new Option(label, service.id));
      });
    });

    serviceSelect.addEventListener("change", () => {
      const services = servicesByBranch[branchSelect.value] || [];
      const service = services.find(item => item.id === serviceSelect.value);
      summary.hidden = !service;
      if (!service) return;

      document.getElementById("summaryBranch").textContent =
        branchSelect.selectedOptions[0].textContent;
      document.getElementById("summaryService").textContent =
        "บริการ: " + service.name;
      document.getElementById("summaryPrice").textContent =
        "ราคา: " + service.price.toLocaleString("th-TH") + " บาท";
      document.getElementById("summaryDuration").textContent =
        "ระยะเวลา: " +
        (service.minutes === 180 ? "3 ชั่วโมง" : "45 นาที");
    });

    function withTimeout(promise, label) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          reject(new Error(label + " เกิน 20 วินาที"));
        }, 20000);

        Promise.resolve(promise).then(
          value => {
            clearTimeout(timer);
            resolve(value);
          },
          error => {
            clearTimeout(timer);
            reject(error);
          }
        );
      });
    }

    function loadSDK() {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
        script.onload = () => {
          if (window.liff) resolve();
          else reject(new Error("ไม่พบชุดเชื่อมต่อ LINE"));
        };
        script.onerror = () => {
          reject(new Error("โหลดชุดเชื่อมต่อ LINE ไม่สำเร็จ"));
        };
        document.head.appendChild(script);
      });
    }

    async function start() {
      try {
        await withTimeout(loadSDK(), "โหลดชุดเชื่อมต่อ LINE");
        await withTimeout(
          liff.init({ liffId: LIFF_ID }),
          "เชื่อมต่อ LIFF"
        );

        if (!liff.isLoggedIn()) {
          statusBox.textContent = "กรุณาเข้าสู่ระบบ LINE เพื่อเลือกบริการ";
          loginButton.hidden = false;
          loginButton.onclick = () => {
            try {
              liff.login();
            } catch (error) {
              statusBox.textContent = "เข้าสู่ระบบไม่สำเร็จ: " +
                (error.message || String(error));
            }
          };
          return;
        }

        const profile = await withTimeout(
          liff.getProfile(),
          "อ่านชื่อบัญชี LINE"
        );
        statusBox.textContent = "สวัสดีคุณ " + profile.displayName;
        document.getElementById("booking").hidden = false;
      } catch (error) {
        statusBox.textContent = "เชื่อมต่อไม่สำเร็จ: " +
          (error.message || String(error));
      }
    }

    start();
  </script>
  <script>
(() => {
  const branch = document.getElementById("branch");
  const service = document.getElementById("service");
  const summaryBox = document.getElementById("summary");

  // รายชื่อสำหรับทดสอบ ยังไม่เชื่อมตารางเข้างาน
  const haircutStaff = {
    "hh-square": ["เท็น", "จิ๋ว", "ปังปอนด์"],
    "hh-camp": ["โอเว่น", "เติ้ล", "เอ๋", "ดี", "ฟิล์ม"],
    "hh-walailak": ["ดรีม", "ฟาฮัด", "ฮาฟิต"],
    "bb-muangthong": ["โต้ง"],
    "bb-walailak": ["อัสลาม", "บอม"],
    "bb-thaphae": ["เอฟ"]
  };

  const chemicalStaff = ["นัด", "บี", "แอน", "เจนนี่"];

  const section = document.createElement("section");
  section.hidden = true;
  section.innerHTML = `
    <h2>3. เลือกช่าง</h2>
    <p class="note">
      รายชื่อทดสอบ ยังไม่ยืนยันการเข้างานและระดับราคาของช่าง
    </p>
    <label for="barber">ช่างที่ต้องการ</label>
    <select id="barber"></select>

    <h2>4. เลือกวันและเวลา</h2>
    <label for="bookingDate">วันที่ต้องการ</label>
    <input id="bookingDate" type="date"
      style="width:100%;padding:14px;font:inherit;
      border:1px solid #ccc;border-radius:10px;">

    <label for="bookingTime">เวลาทดสอบ</label>
    <select id="bookingTime"></select>
    <p class="note">
      เวลาตัวอย่าง ยังไม่ตรวจวันหยุด คิวซ้อน หรือจำนวนคิวที่เหลือ
      เวลาทั้งหมดเป็นเวลาประเทศไทย
    </p>
    <p id="schedulePreview" role="status"
      style="white-space:pre-line;line-height:1.8;"></p>
  `;

  summaryBox.before(section);

  const barber = document.getElementById("barber");
  const date = document.getElementById("bookingDate");
  const time = document.getElementById("bookingTime");
  const preview = document.getElementById("schedulePreview");

  function todayBangkok() {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Bangkok",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date());

    const get = type => parts.find(p => p.type === type).value;
    return get("year") + "-" + get("month") + "-" + get("day");
  }

  function selectedService() {
    return (servicesByBranch[branch.value] || [])
      .find(item => item.id === service.value);
  }

  function clock(minutes) {
    return String(Math.floor(minutes / 60)).padStart(2, "0") +
      ":" + String(minutes % 60).padStart(2, "0");
  }

  function resetSchedule() {
    section.hidden = true;
    barber.replaceChildren(new Option("กรุณาเลือกช่าง", ""));
    time.replaceChildren(new Option("กรุณาเลือกเวลา", ""));
    date.value = "";
    preview.textContent = "";
  }

  function showPreview() {
    preview.textContent = "";
    if (!barber.value || !date.value || !time.value) return;

    if (date.value < todayBangkok()) {
      preview.textContent = "กรุณาเลือกวันที่ตั้งแต่วันนี้เป็นต้นไป";
      return;
    }

    const start = new Date(date.value + "T" + time.value + ":00+07:00");
    if (start.getTime() <= Date.now()) {
      preview.textContent = "เวลานี้ผ่านไปแล้ว กรุณาเลือกเวลาใหม่";
      return;
    }

    const chosen = selectedService();
    if (!chosen) return;

    const [hour, minute] = time.value.split(":").map(Number);
    const end = clock(hour * 60 + minute + chosen.minutes);

    preview.textContent =
      "ตัวอย่างรายการที่เลือก\n" +
      "ช่าง: " + barber.value + "\n" +
      "วันที่: " + date.value.split("-").reverse().join("/") + "\n" +
      "เวลา: " + time.value + "–" + end + " น.\n" +
      "ยังไม่ได้จองหรือกันคิว";
  }

  branch.addEventListener("change", () => {
    resetSchedule();

    // แก้ชื่อบริการตัดผมที่มีราคาซ้ำ
    const list = servicesByBranch[branch.value] || [];
    Array.from(service.options).forEach(option => {
      const item = list.find(s => s.id === option.value);
      if (item && item.id.startsWith("cut-")) {
        option.textContent =
          "ตัดผม — " + item.price.toLocaleString("th-TH") + " บาท";
      }
    });
  });

  service.addEventListener("change", () => {
    resetSchedule();
    const chosen = selectedService();
    if (!chosen) return;

    const chemical = !chosen.id.startsWith("cut-");
    const names = chemical
      ? chemicalStaff
      : (haircutStaff[branch.value] || []);

    names.forEach(name => {
      barber.add(new Option(name, name));
    });

    date.min = todayBangkok();

    if (chemical) {
      ["09:00", "13:00"].forEach(value => {
        time.add(new Option(value + " น. — รอบทดสอบ", value));
      });
    } else {
      // ตัวอย่างเวลาเริ่มทุก 45 นาที ภายใน 09:00–20:00
      for (let minutes = 540; minutes + chosen.minutes <= 1200;
           minutes += 45) {
        const value = clock(minutes);
        time.add(new Option(value + " น. — เวลาทดสอบ", value));
      }
    }

    section.hidden = false;
  });

  barber.addEventListener("change", showPreview);
  date.addEventListener("change", showPreview);
  time.addEventListener("change", showPreview);
})();
</script>
</body>
</html>
