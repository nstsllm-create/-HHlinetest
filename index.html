<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>His and Hairs Booking</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f3f4f6;color:#222;font-family:system-ui,sans-serif}main{max-width:520px;margin:20px auto;padding:24px;background:#fff;border-radius:18px}h1{margin-top:0}label{display:block;margin:14px 0 6px}select,input,button{width:100%;padding:13px;border-radius:10px;font:inherit}select,input{border:1px solid #ccc;background:#fff}button{border:0;background:#06c755;color:#fff;margin-top:14px;cursor:pointer}button:disabled{opacity:.55}.note{font-size:14px;color:#666;line-height:1.6}.box{margin-top:18px;padding:16px;border-radius:12px;background:#eff6ff;white-space:pre-line;line-height:1.7}#qr{display:block;width:100%;max-width:300px;margin:12px auto}.error{color:#b91c1c}.ok{color:#166534}[hidden]{display:none!important}
</style>
</head>
<body><main>
<h1>His and Hairs Booking</h1><p id="status">กำลังเชื่อมต่อ LINE…</p><button id="login" hidden>เข้าสู่ระบบ LINE</button>
<section id="app" hidden>
<label for="branch">1. สาขา</label><select id="branch"><option value="">กำลังโหลด…</option></select>
<label for="service">2. บริการ</label><select id="service" disabled><option value="">เลือกสาขาก่อน</option></select>
<label for="staff">3. ช่าง</label><select id="staff" disabled><option value="">เลือกบริการก่อน</option></select>
<label for="date">4. วันที่</label><input id="date" type="date" disabled>
<label for="time">5. เวลาว่าง</label><select id="time" disabled><option value="">เลือกวันและช่างก่อน</option></select>
<p id="notice" class="note"></p><button id="book" disabled>ยืนยันการจอง</button>
<div id="result" class="box" hidden></div>
<div id="payment" class="box" hidden><strong>ชำระเงิน</strong><img id="qr" alt="QR สำหรับชำระเงิน"><p id="paymentText"></p></div>
</section><p class="note">ระบบจะสร้างรายการสถานะรอชำระเงิน ร้านจะยืนยันคิวหลังตรวจสอบหลักฐานการชำระเงิน</p>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID='2007513533-R2eJcQzQ',API='https://script.google.com/macros/s/AKfycbzF1clYVoU6fhE7qOsv1oOs-XS-_G-fYwtJ-G_aAto-PefaQcCjbMR6cDpjrYCQGexi/exec';
const $=id=>document.getElementById(id),state={catalog:null,config:null};
const bangkokToday=()=>{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return p.filter(x=>x.type!=='literal').map(x=>x.value).join('-')};
const msg=(t,err=false)=>{$('notice').textContent=t;$('notice').className=err?'note error':'note'};
const setOptions=(id,items,empty)=>{$(id).replaceChildren(new Option(empty,''));items.forEach(x=>$(id).add(new Option(x.label,x.value)))};
async function get(url){const r=await fetch(url,{credentials:'omit',redirect:'follow'});const j=await r.json();if(!j.ok)throw Error(j.message||'ดำเนินการไม่สำเร็จ');return j.data}
async function post(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},credentials:'omit',redirect:'follow',body:JSON.stringify(body)});const text=await r.text();let j;try{j=JSON.parse(text)}catch(e){throw Error('ระบบตอบกลับไม่สมบูรณ์ กรุณาตรวจสอบสถานะการจองก่อนส่งซ้ำ')}if(!j.ok)throw Error(j.message||'ดำเนินการไม่สำเร็จ');return j.data}
function service(){return state.catalog?.services.find(x=>x.id===$("service").value)}
function staff(){return state.catalog?.staff.find(x=>x.id===$("staff").value)}
function resetAfter(id){const ids=['service','staff','date','time'];const n=ids.indexOf(id);ids.slice(n+1).forEach(x=>{$(x).disabled=true;$(x).replaceChildren(new Option('เลือกข้อมูลก่อน',''))});$('book').disabled=true;$('result').hidden=true;$('payment').hidden=true}
async function refreshTimes(){resetAfter('date');const s=service(),d=$('date').value,b=$('branch').value,st=$('staff').value;if(!s||!d||!b||!st)return;msg('กำลังตรวจเวลาว่าง…');try{const data=await get(API+'?'+new URLSearchParams({action:'availability',date:d,branchId:b,staffId:st,serviceId:s.id}));const slots=Array.isArray(data.slots)?data.slots:[];setOptions('time',slots.map(x=>({label:x.start+'–'+x.end+' น.',value:x.start})),slots.length?'เลือกเวลา':'ไม่พบเวลาว่าง');$('time').disabled=!slots.length;msg(slots.length?'เลือกเวลาได้แล้ว':'ไม่พบเวลาว่างสำหรับรายการนี้',!slots.length)}catch(e){msg(e.message,true)}}
async function boot(){try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){$('login').hidden=false;$('status').textContent='กรุณาเข้าสู่ระบบ LINE';return}$('status').textContent='กำลังโหลดข้อมูล…';const [catalog,config]=await Promise.all([get(API+'?action=catalog'),get(API+'?action=booking-config')]);state.catalog=catalog;state.config=config;$('app').hidden=false;$('date').min=bangkokToday();setOptions('branch',catalog.branches.map(x=>({label:x.name,value:x.id})),'เลือกสาขา');if(!config.enabled)msg('ระบบจองจริงยังไม่เปิด กรุณาติดต่อร้าน',true);$('branch').disabled=false;$('status').textContent='พร้อมจองคิว'}catch(e){$('status').textContent=e.message;$('status').className='error'}}
$('login').onclick=()=>liff.login();$('branch').onchange=()=>{resetAfter('branch');const a=state.catalog.services.filter(x=>x.branchId===$( 'branch').value);setOptions('service',a.map(x=>({label:x.name+' — '+Number(x.price).toLocaleString('th-TH')+' บาท',value:x.id})),'เลือกบริการ');$('service').disabled=!a.length};$('service').onchange=()=>{resetAfter('service');const x=service();if(!x)return;const role=x.name.startsWith('ตัดผม')?'BARBER':'CHEMICAL_STYLIST';const a=state.catalog.staff.filter(y=>y.role===role);setOptions('staff',a.map(y=>({label:y.name,value:y.id})),'เลือกช่าง');$('staff').disabled=!a.length;$('date').disabled=!a.length};$('staff').onchange=()=>refreshTimes();$('date').onchange=()=>refreshTimes();$('time').onchange=()=>{$('book').disabled=!$('time').value||!state.config?.enabled};$('book').onclick=async()=>{const s=service(),st=staff();if(!s||!st||!$('time').value)return;const b=$('book');b.disabled=true;$('result').hidden=true;$('payment').hidden=true;msg('กำลังสร้างรายการจอง…');const requestId=sessionStorage.getItem('hh_booking_request_id')||('BOOK-'+crypto.randomUUID());sessionStorage.setItem('hh_booking_request_id',requestId);try{const token=liff.getIDToken();if(!token)throw Error('ไม่พบการยืนยันบัญชี LINE กรุณาเปิดลิงก์นี้จากแอป LINE');const d=await post({action:'create-booking',idToken:token,requestId,branchId:$('branch').value,serviceId:s.id,staffId:st.id,date:$('date').value,time:$('time').value});$('result').textContent='จองสำเร็จ\nเลขที่จอง: '+(d.reservationId||'-')+'\nสถานะ: รอชำระเงิน';$('result').hidden=false;const c=state.config;$('qr').src=c.paymentQrUrl||'';$('paymentText').textContent='จำนวนเงิน: '+(d.amount??d.price??s.price)+' บาท\nธนาคาร: '+(c.paymentBankName||'-')+'\nชื่อบัญชี: '+(c.paymentAccountName||'-')+'\nเลขบัญชี: '+(c.paymentAccountNumber||'-')+'\nกรุณาส่งสลิปให้ร้านผ่าน LINE OA';$('payment').hidden=false;msg('สร้างรายการจองแล้ว กรุณาชำระเงินและส่งหลักฐานให้ร้าน');sessionStorage.removeItem('hh_booking_request_id')}catch(e){msg(e.message+' หากเห็นรายการจองใน LINE หรือหลังบ้านแล้ว ห้ามกดซ้ำ',true);b.disabled=true}};boot();
</script></body></html>
