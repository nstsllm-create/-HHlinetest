<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>His and Hairs Booking</title><style>body{font-family:system-ui;background:#f3f4f6;margin:0;padding:16px}main{max-width:520px;margin:auto;background:white;padding:24px;border-radius:16px}label{display:block;margin-top:14px}select,input,button{width:100%;padding:13px;margin-top:6px;border-radius:10px;font:inherit}button{background:#06c755;color:white;border:0;margin-top:18px}button:disabled{opacity:.5}.box{margin-top:16px;padding:14px;background:#eff6ff;white-space:pre-line}.err{color:#b91c1c}.note{color:#666}</style><main><h1>His and Hairs Booking</h1><p id="status">กำลังเชื่อมต่อ LINE…</p><button id="login" hidden>เข้าสู่ระบบ LINE</button><section id="app" hidden><label>1. สาขา<select id="branch"></select></label><label>2. บริการ<select id="service" disabled></select></label><label>3. ช่าง<select id="staff" disabled></select></label><label>4. วันที่<input id="date" type="date" disabled></label><label>5. เวลาว่าง<select id="time" disabled></select></label><p id="notice" class="note"></p><button id="book" disabled>ยืนยันการจอง</button><div id="result" class="box" hidden></div><div id="payment" class="box" hidden><b>ชำระเงิน</b><p id="paymentText"></p></div></section><p class="note">ระบบจะสร้างรายการรอชำระเงิน ร้านจะยืนยันหลังตรวจสลิป</p></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>const LIFF_ID='2007513533-R2eJcQzQ',API='https://script.google.com/macros/s/AKfycbyW2DMLWTwKs7kSSA-2byivHD7O7HNjD2pYXQJ3t3UjxCI0bcAo0yDVqT97wanyzM0t/exec',q=id=>document.getElementById(id),S={};const opt=(id,a,e)=>{q(id).replaceChildren(new Option(e,''),...a.map(x=>new Option(x.label,x.value)))};async function get(u){let r=await fetch(u),j=await r.json();if(!j.ok)throw Error(j.message||'โหลดข้อมูลไม่สำเร็จ');return j.data}async function post(x){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(x)}),j=await r.json();if(!j.ok)throw Error(j.message||'จองไม่สำเร็จ');return j.data}function service(){return S.c?.services.find(x=>x.id===q('service').value)}function staff(){return S.c?.staff.find(x=>x.id===q('staff').value)}async function times(){q('time').disabled=true;q('book').disabled=true;let s=service();if(!s||!q('date').value||!q('staff').value)return;try{let d=await get(API+'?'+new URLSearchParams({action:'availability',date:q('date').value,branchId:q('branch').value,staffId:q('staff').value,serviceId:s.id}));opt('time',(d.slots||[]).map(x=>({label:x.start+'–'+x.end+' น.',value:x.start})),'เลือกเวลา');q('time').disabled=!(d.slots||[]).length;q('notice').textContent=(d.slots||[]).length?'เลือกเวลาได้แล้ว':'ไม่พบเวลาว่าง'}catch(e){q('notice').textContent=e.message;q('notice').className='err'}}async function boot(){try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){q('login').hidden=false;q('status').textContent='กรุณาเข้าสู่ระบบ LINE';return}let [c,config]=await Promise.all([get(API+'?action=catalog'),get(API+'?action=booking-config')]);S.c=c;S.config=config;q('app').hidden=false;opt('branch',c.branches.map(x=>({label:x.name,value:x.id})),'เลือกสาขา');q('branch').disabled=false;q('status').textContent=config.enabled?'พร้อมจองคิว':'ระบบจองยังไม่เปิด'}catch(e){q('status').textContent=e.message;q('status').className='err'}}q('login').onclick=()=>liff.login();q('branch').onchange=()=>{let a=S.c.services.filter(x=>x.branchId===q('branch').value);opt('service',a.map(x=>({label:x.name+' — '+x.price+' บาท',value:x.id})),'เลือกบริการ');q('service').disabled=!a.length;q('staff').disabled=true;q('date').disabled=true};q('service').onchange=()=>{let x=service(),role=x&&x.name.startsWith('ตัดผม')?'BARBER':'CHEMICAL_STYLIST',a=S.c.staff.filter(y=>y.role===role);opt('staff',a.map(y=>({label:y.name,value:y.id})),'เลือกช่าง');q('staff').disabled=!a.length;q('date').disabled=!a.length};q('staff').onchange=times;q('date').onchange=times;q('time').onchange=()=>q('book').disabled=!q('time').value||!S.config.enabled;q('book').onclick=async()=>{let s=service(),st=staff(),id=sessionStorage.getItem('hh_booking_request_id')||'BOOK-'+crypto.randomUUID();sessionStorage.setItem('hh_booking_request_id',id);q('book').disabled=true;try{let d=await post({action:'create-booking',idToken:liff.getIDToken(),requestId:id,branchId:q('branch').value,serviceId:s.id,staffId:st.id,date:q('date').value,time:q('time').value});q('result').textContent='สร้างรายการจองแล้ว\nเลขที่: '+(d.reservationId||'-')+'\nสถานะ: รอชำระเงิน';q('result').hidden=false;q('paymentText').textContent='กรุณาชำระเงินและส่งสลิปให้ร้านผ่าน LINE OA';q('payment').hidden=false;sessionStorage.removeItem('hh_booking_request_id')}catch(e){q('notice').textContent=e.message+' หากรายการถูกสร้างแล้ว ห้ามกดซ้ำ';q('notice').className='err'}};boot();</script>
