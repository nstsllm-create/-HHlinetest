<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>His and Hairs Booking</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      color: #222;
    }
    main {
      max-width: 520px;
      margin: 24px auto;
      padding: 28px;
      background: white;
      border-radius: 20px;
    }
    h1 { font-size: 26px; margin-top: 0; }
    h2 { font-size: 20px; margin-top: 28px; }
    p { line-height: 1.7; }
    label { display: block; margin: 16px 0 10px; }
    select, button {
      width: 100%;
      padding: 14px;
      font: inherit;
      border-radius: 10px;
    }
    select { border: 1px solid #ccc; background: white; }
    button {
      margin-top: 16px;
      border: 0;
      background: #06c755;
      color: white;
      cursor: pointer;
    }
    .note { color: #666; font-size: 14px; }
    #summary {
      margin-top: 24px;
      padding: 18px;
      background: #f0fdf4;
      border-radius: 12px;
    }
    #summary p { margin: 8px 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>His and Hairs Booking</h1>
    <p id="status" role="status">กำลังเชื่อมต่อ LINE…</p>
    <button id="login" hidden>เข้าสู่ระบบ LINE</button>

    <section id="booking" hidden>
      <h2>1. เลือกสาขา</h2>
      <label for="branch">สาขาที่ต้องการใช้บริการ</label>
      <select id="branch">
        <option value="">กรุณาเลือกสาขา</option>
        <optgroup label="His and Hairs">
          <option value="hh-square">His and Hairs — ศิรินครสแควร์</option>
          <option value="hh-camp">His and Hairs — หน้าค่ายวชิราวุธ</option>
          <option value="hh-walailak">His and Hairs — วลัยลักษณ์</option>
        </optgroup>
        <optgroup label="BarberBoss">
          <option value="bb-muangthong">BarberBoss — หมู่บ้านเมืองทอง</option>
          <option value="bb-walailak">BarberBoss — วลัยลักษณ์</option>
          <option value="bb-thaphae">BarberBoss — 7-Eleven ท่าแพ</option>
        </optgroup>
      </select>

      <section id="serviceSection" hidden>
        <h2>2. เลือกบริการ</h2>
        <label for="service">บริการและราคา</label>
        <select id="service"></select>
        <p class="note">ราคาปกติสำหรับทดสอบ ยังไม่รวมโปรโมชั่น</p>
      </section>

      <section id="summary" aria-live="polite" hidden>
        <strong>รายการที่เลือก</strong>
        <p id="summaryBranch"></p>
        <p id="summaryService"></p>
        <p id="summaryPrice"></p>
        <p id="summaryDuration"></p>
        <p class="note">ยังไม่ได้จองคิว ขั้นตอนเลือกช่างและวันเวลาจะเพิ่มต่อไป</p>
      </section>
    </section>

    <p class="note">หน้าทดสอบ ยังไม่เปิดรับจองหรือรับชำระเงิน</p>
  </main>

  <script>
    const LIFF_ID = "2007513533-R2eJcQzQ";
    const statusBox = document.getElementById("status");
    const loginButton = document.getElementById("login");
    const branchSelect = document.getElementById("branch");
    const serviceSelect = document.getElementById("service");
    const serviceSection = document.getElementById("serviceSection");
    const summary = document.getElementById("summary");

    function haircut(price) {
      return {
        id: "cut-" + price,
        name: "ตัดผม " + price + " บาท",
        price: price,
        minutes: 45
      };
    }

    const chemicalServices = [
      { id: "volume-straight", name: "ยืดวอลลุ่ม", price: 1500, minutes: 180 },
      { id: "keratin", name: "เคราติน", price: 1800, minutes: 180 },
      { id: "premium-straight", name: "ยืดพรีเมียม", price: 2000, minutes: 180 },
      { id: "volume-perm", name: "ดัดวอลลุ่ม", price: 1500, minutes: 180 },
      { id: "curly", name: "ดัดเคอร์ลี่", price: 1800, minutes: 180 },
      { id: "foil", name: "ดัดฟอยล์", price: 1800, minutes: 180 },
      { id: "rod-spiral", name: "ดัดแกน / สไปรัล", price: 1800, minutes: 180 },
      { id: "grey-cover", name: "ปิดผมขาว", price: 600, minutes: 180 },
      { id: "fashion-color", name: "ทำสีแฟชั่น", price: 2500, minutes: 180 }
    ];

    const servicesByBranch = {
      "hh-square": [
        haircut(300),
        haircut(400),
        haircut(500),
        ...chemicalServices
      ],
      "hh-camp": [haircut(150), haircut(200)],
      "hh-walailak": [haircut(150), haircut(200)],
      "bb-muangthong": [haircut(100)],
      "bb-walailak": [haircut(100)],
      "bb-thaphae": [haircut(100)]
    };

    branchSelect.addEventListener("change", () => {
      summary.hidden = true;
      serviceSelect.replaceChildren(
        new Option("กรุณาเลือกบริการ", "")
      );

      const services = servicesByBranch[branchSelect.value] || [];
      serviceSection.hidden = services.length === 0;

      services.forEach(service => {
        const label = service.name +
          " — " + service.price.toLocaleString("th-TH") + " บาท";
        serviceSelect.add(new Option(label, service.id));
      });
    });

    serviceSelect.addEventListener("change", () => {
      const services = servicesByBranch[branchSelect.value] || [];
      const service = services.find(item => item.id === serviceSelect.value);
      summary.hidden = !service;
      if (!service) return;

      document.getElementById("summaryBranch").textContent =
        branchSelect.selectedOptions[0].textContent;
      document.getElementById("summaryService").textContent =
        "บริการ: " + service.name;
      document.getElementById("summaryPrice").textContent =
        "ราคา: " + service.price.toLocaleString("th-TH") + " บาท";
      document.getElementById("summaryDuration").textContent =
        "ระยะเวลา: " +
        (service.minutes === 180 ? "3 ชั่วโมง" : "45 นาที");
    });

    function withTimeout(promise, label) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          reject(new Error(label + " เกิน 20 วินาที"));
        }, 20000);

        Promise.resolve(promise).then(
          value => {
            clearTimeout(timer);
            resolve(value);
          },
          error => {
            clearTimeout(timer);
            reject(error);
          }
        );
      });
    }

    function loadSDK() {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://static.line-scdn.net/liff/edge/2/sdk.js";
        script.onload = () => {
          if (window.liff) resolve();
          else reject(new Error("ไม่พบชุดเชื่อมต่อ LINE"));
        };
        script.onerror = () => {
          reject(new Error("โหลดชุดเชื่อมต่อ LINE ไม่สำเร็จ"));
        };
        document.head.appendChild(script);
      });
    }

    async function start() {
      try {
        await withTimeout(loadSDK(), "โหลดชุดเชื่อมต่อ LINE");
        await withTimeout(
          liff.init({ liffId: LIFF_ID }),
          "เชื่อมต่อ LIFF"
        );

        if (!liff.isLoggedIn()) {
          statusBox.textContent = "กรุณาเข้าสู่ระบบ LINE เพื่อเลือกบริการ";
          loginButton.hidden = false;
          loginButton.onclick = () => {
            try {
              liff.login();
            } catch (error) {
              statusBox.textContent = "เข้าสู่ระบบไม่สำเร็จ: " +
                (error.message || String(error));
            }
          };
          return;
        }

        const profile = await withTimeout(
          liff.getProfile(),
          "อ่านชื่อบัญชี LINE"
        );
        statusBox.textContent = "สวัสดีคุณ " + profile.displayName;
        document.getElementById("booking").hidden = false;
      } catch (error) {
        statusBox.textContent = "เชื่อมต่อไม่สำเร็จ: " +
          (error.message || String(error));
      }
    }

    start();
  </script>
</body>
</html>
